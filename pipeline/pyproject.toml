[project]
name = "prominence-pipeline"
version = "0.1.0"
description = "Builds the population-as-terrain dataset: density pyramid, divide tree, peaks and tiles."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "numpy>=2.0",
  "numba>=0.60",
  "rasterio>=1.4",
  "rio-tiler>=7.0",
  "pmtiles>=3.3",
  "pillow>=10",
  "httpx>=0.27",
  "typer>=0.12",
  "scipy>=1.18.1",
]

[project.scripts]
prominence = "prominence.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prominence"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
